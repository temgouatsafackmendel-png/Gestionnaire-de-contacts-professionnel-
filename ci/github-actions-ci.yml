name: CI — Veridian Contacts Quality & Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Unit/Integration Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (Lint)
        run: npm run lint

      - name: Run Automated Test Suite (Vitest + Supertest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
