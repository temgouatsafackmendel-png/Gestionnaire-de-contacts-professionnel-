<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1280" height="760" fill="#F8FAFC"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="58" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="32" y="35" font-size="17" font-weight="700" fill="#0F172A">Veridian Contacts</text>
  <text x="410" y="34" font-size="13" font-weight="500" fill="#64748B">Répertoire (10)</text>
  <text x="535" y="34" font-size="13" font-weight="500" fill="#64748B">Doublons (2)</text>
  <text x="645" y="34" font-size="13" font-weight="600" fill="#0F172A">Import &amp; Export</text>
  <line x1="645" y1="46" x2="748" y2="46" stroke="#0F172A" stroke-width="2.5"/>
  <text x="770" y="34" font-size="13" font-weight="500" fill="#64748B">Journal d'Audit (24)</text>
  <rect x="1108" y="14" width="140" height="32" rx="7" fill="#0F172A"/>
  <text x="1126" y="34" font-size="12" font-weight="600" fill="#FFFFFF">+ Nouveau Contact</text>

  <!-- Top Row: Export & Backup Cards (Streamlined UI) -->
  <rect x="32" y="80" width="596" height="170" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="110" font-size="15" font-weight="700" fill="#0F172A">Exportation du carnet (CSV &amp; JSON)</text>
  <text x="56" y="130" font-size="11.5" fill="#64748B">Téléchargez l'intégralité de vos contacts ou uniquement votre sélection filtrée.</text>
  <line x1="56" y1="146" x2="604" y2="146" stroke="#E2E8F0"/>
  <text x="56" y="168" font-size="12" fill="#475569">Total des contacts enregistrés :</text>
  <text x="540" y="168" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#0F172A">10 contacts</text>
  <rect x="56" y="192" width="166" height="34" rx="7" fill="#0F172A"/>
  <text x="76" y="213" font-size="11.5" font-weight="600" fill="#FFFFFF">⬇ Exporter en CSV (10)</text>
  <rect x="234" y="192" width="174" height="34" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="254" y="213" font-size="11.5" font-weight="600" fill="#0F172A">⬇ Exporter en JSON (10)</text>

  <rect x="652" y="80" width="596" height="170" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="110" font-size="15" font-weight="700" fill="#0F172A">Sauvegarde &amp; Données d'exemple</text>
  <text x="676" y="130" font-size="11.5" fill="#64748B">Vos modifications sont sauvegardées automatiquement à chaque opération.</text>
  <line x1="676" y1="146" x2="1224" y2="146" stroke="#E2E8F0"/>
  <text x="676" y="168" font-size="12" fill="#475569">État de la sauvegarde automatique :</text>
  <text x="1115" y="168" font-size="12" font-weight="700" fill="#047857">Active et à jour</text>
  <rect x="676" y="192" width="190" height="34" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="698" y="213" font-size="11.5" font-weight="600" fill="#0F172A">↻ Sauvegarder maintenant</text>
  <rect x="878" y="192" width="268" height="34" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="898" y="213" font-size="11.5" font-weight="500" fill="#475569">Restaurer les contacts d'exemple (10 fiches)</text>

  <!-- Bottom Section: Import & Line-by-Line Validation Report -->
  <rect x="32" y="268" width="1216" height="442" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="298" font-size="15" font-weight="700" fill="#0F172A">Importation CSV / JSON avec signalement des lignes invalides</text>
  <text x="56" y="318" font-size="11.5" fill="#64748B">Chaque ligne est contrôlée avant import. Les entrées comportant un email ou un téléphone invalide sont isolées avec leur numéro de ligne exact.</text>

  <rect x="56" y="336" width="1168" height="94" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="72" y="358" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">firstName,lastName,email,phone,company,jobTitle,category</text>
  <text x="72" y="376" font-family="'JetBrains Mono', monospace" font-size="11" fill="#047857">Inès,Roche,ines.roche@valmy-med.fr,+33 6 21 43 65 87,Valmy Médical,Responsable Clinique,client</text>
  <text x="72" y="394" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B91C1C">Jean,Dupont,email-invalide-sans-domaine,06 12 34 56 78,Dupont &amp; Co,Consultant,prospect</text>
  <text x="72" y="412" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B91C1C">,Martin,paul.martin@exemple.fr,12345,Martin SAS,Gérant,fournisseur</text>

  <!-- Report Header -->
  <text x="56" y="458" font-size="13.5" font-weight="700" fill="#0F172A">Rapport d'analyse (Import Exécuté)</text>
  <text x="690" y="458" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748B">Total analysé : 4 · Valides : 2 · Créés : 1 · Doublons ignorés : 1 · Rejets invalides : 2</text>

  <!-- Red Error Table -->
  <rect x="56" y="474" width="1168" height="156" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="76" y="500" font-size="12.5" font-weight="700" fill="#7F1D1D">⚠  2 ligne(s) invalide(s) signalée(s) et rejetée(s)</text>
  <text x="975" y="500" font-size="11.5" font-weight="600" fill="#991B1B" text-decoration="underline">Télécharger le rapport d'erreurs (.json)</text>

  <line x1="76" y1="514" x2="1204" y2="514" stroke="#FECACA"/>
  <text x="76" y="532" font-size="11" font-weight="600" fill="#991B1B">Ligne</text>
  <text x="180" y="532" font-size="11" font-weight="600" fill="#991B1B">Entrée concernée</text>
  <text x="480" y="532" font-size="11" font-weight="600" fill="#991B1B">Anomalies détectées</text>

  <line x1="76" y1="542" x2="1204" y2="542" stroke="#FEE2E2"/>
  <text x="76" y="566" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#7F1D1D">Ligne 3</text>
  <text x="180" y="566" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#991B1B">Jean · Dupont · email-invalide-sans-domaine</text>
  <text x="480" y="566" font-size="11.5" fill="#7F1D1D">Format d'email invalide ("email-invalide-sans-domaine"). Attendu : exemple@domaine.fr</text>

  <line x1="76" y1="582" x2="1204" y2="582" stroke="#FEE2E2"/>
  <text x="76" y="606" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#7F1D1D">Ligne 4</text>
  <text x="180" y="606" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#991B1B">Martin · paul.martin@exemple.fr</text>
  <text x="480" y="606" font-size="11.5" fill="#7F1D1D">Le prénom est obligatoire · Longueur de numéro invalide (5 chiffres dans "12345").</text>

  <!-- Amber Duplicate Warning Banner -->
  <rect x="56" y="642" width="1168" height="50" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="76" y="664" font-size="11.5" font-weight="700" fill="#92400E">Doublon détecté lors de l'import (1) :</text>
  <text x="76" y="681" font-family="'JetBrains Mono', monospace" font-size="11" fill="#B45309">Ligne 5 : Camille Moreau (camille.moreau@atelier-veridian.fr) correspond à une fiche existante — Adresse email identique [Action : skipped]</text>

  <!-- Clean Footer -->
  <rect x="0" y="724" width="1280" height="36" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="32" y="746" font-size="11.5" fill="#64748B">
    <tspan font-weight="700" fill="#0F172A">Veridian Contacts</tspan> · Projet conçu et réalisé de bout en bout par <tspan font-weight="700" fill="#0F172A">Mendel Temgoua</tspan>
  </text>
</svg>
