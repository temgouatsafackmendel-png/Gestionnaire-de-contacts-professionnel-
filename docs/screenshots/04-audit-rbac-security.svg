<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="540" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- RBAC Banner -->
  <rect x="28" y="24" width="1144" height="92" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="48" y="54" font-size="16" font-weight="700" fill="#0F172A">🛡 Contrôle d'accès basé sur les rôles (RBAC) &amp; Journal d'Audit</text>
  <text x="48" y="76" font-size="12" fill="#64748B">Toutes les opérations sensibles (création, modification, suppression, fusion, import/export et refus 403) sont tracées.</text>

  <!-- Role Switcher Pills -->
  <rect x="650" y="42" width="500" height="38" rx="8" fill="#F1F5F9"/>
  <rect x="654" y="46" width="142" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="670" y="65" font-size="11.5" font-weight="700" fill="#0F172A">Admin (Complet)</text>
  <text x="812" y="65" font-size="11.5" font-weight="500" fill="#475569">Éditeur (Sans suppr.)</text>
  <text x="965" y="65" font-size="11.5" font-weight="500" fill="#475569">Lecteur (Consultation)</text>

  <!-- Audit Log Table -->
  <rect x="28" y="136" width="1144" height="378" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="48" y="168" font-size="14" font-weight="700" fill="#0F172A">Événements d'audit enregistrés (Journal immuable SQLite)</text>
  <rect x="920" y="148" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="935" y="167" font-size="11.5" fill="#0F172A">Toutes les actions                 ▾</text>

  <line x1="28" y1="190" x2="1172" y2="190" stroke="#E2E8F0"/>
  <text x="48" y="214" font-size="11.5" font-weight="600" fill="#64748B">Horodatage UTC</text>
  <text x="250" y="214" font-size="11.5" font-weight="600" fill="#64748B">Rôle</text>
  <text x="370" y="214" font-size="11.5" font-weight="600" fill="#64748B">Action</text>
  <text x="580" y="214" font-size="11.5" font-weight="600" fill="#64748B">Détail de l'opération</text>
  <line x1="28" y1="226" x2="1172" y2="226" stroke="#E2E8F0"/>

  <!-- Log Entry 1 -->
  <text x="48" y="256" font-family="monospace" font-size="12" fill="#64748B">2026-11-16 21:24:12</text>
  <text x="250" y="256" font-family="monospace" font-size="12" fill="#334155">viewer</text>
  <text x="370" y="256" font-family="monospace" font-size="12" font-weight="700" fill="#B91C1C">PERMISSION_DENIED</text>
  <text x="580" y="256" font-size="12" fill="#0F172A">Accès refusé (viewer) pour l'opération : Suppression de contact</text>
  <line x1="28" y1="276" x2="1172" y2="276" stroke="#F1F5F9"/>

  <!-- Log Entry 2 -->
  <text x="48" y="306" font-family="monospace" font-size="12" fill="#64748B">2026-11-16 21:22:48</text>
  <text x="250" y="306" font-family="monospace" font-size="12" fill="#334155">editor</text>
  <text x="370" y="306" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">IMPORT_CONTACTS</text>
  <text x="580" y="306" font-size="12" fill="#0F172A">Import CSV : 1 créés, 0 mis à jour, 1 doublons ignorés, 2 lignes invalides rejetées.</text>
  <line x1="28" y1="326" x2="1172" y2="326" stroke="#F1F5F9"/>

  <!-- Log Entry 3 -->
  <text x="48" y="356" font-family="monospace" font-size="12" fill="#64748B">2026-11-16 21:20:05</text>
  <text x="250" y="356" font-family="monospace" font-size="12" fill="#334155">admin</text>
  <text x="370" y="356" font-family="monospace" font-size="12" font-weight="700" fill="#047857">MERGE_CONTACTS</text>
  <text x="580" y="356" font-size="12" fill="#0F172A">Doublon fusionné : Thomas Lefevre absorbé dans Thomas Lefèvre (+33645781233)</text>
  <line x1="28" y1="376" x2="1172" y2="376" stroke="#F1F5F9"/>

  <!-- Log Entry 4 -->
  <text x="48" y="406" font-family="monospace" font-size="12" fill="#64748B">2026-11-16 21:18:30</text>
  <text x="250" y="406" font-family="monospace" font-size="12" fill="#334155">admin</text>
  <text x="370" y="406" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">EXPORT_CONTACTS</text>
  <text x="580" y="406" font-size="12" fill="#0F172A">Export CSV généré (10 contacts) — encodage UTF-8 BOM &amp; protection formules.</text>
  <line x1="28" y1="426" x2="1172" y2="426" stroke="#F1F5F9"/>

  <!-- Log Entry 5 -->
  <text x="48" y="456" font-family="monospace" font-size="12" fill="#64748B">2026-11-16 21:16:18</text>
  <text x="250" y="456" font-family="monospace" font-size="12" fill="#334155">admin</text>
  <text x="370" y="456" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">BACKUP_RESTORE</text>
  <text x="580" y="456" font-size="12" fill="#0F172A">Sauvegarde synchronisée SQLite WAL + Miroir JSON vérifiée avec succès.</text>
</svg>
